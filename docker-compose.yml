# Local development database (and optional pgAdmin UI).
#
#   Start:    docker compose up -d
#   Stop:     docker compose down          (data is kept)
#   Reset:    docker compose down -v       (⚠ deletes all data)
#   Logs:     docker compose logs -f db
#
# Credentials come from .env at the repo root — copy .env.example to .env first.
# Keep them identical to backend/.env DATABASE_URL.

services:
  db:
    image: postgres:16-alpine
    container_name: lidya-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lidyaculturalfood}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - lidya_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Backend waits for this before running migrations.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lidyaculturalfood}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional database GUI — start with:  docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lidya-pgadmin
    profiles: ['tools']
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@lidya.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    depends_on:
      db:
        condition: service_healthy

volumes:
  lidya_pgdata:
    name: lidya_pgdata
